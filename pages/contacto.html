<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/styles.css" />
    <title>Contacto | Pixel Plaza</title>
  </head>
  <body>
    <header>
      <a class="logo" href="../index.html">Pixel<span>Plaza</span></a>
      <nav class="header-nav" aria-label="Principal">
        <ul>
          <li><a href="../index.html">Inicio</a></li>
          <li><a href="./contacto.html" aria-current="page">Contacto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="contacto">
        <h1>Escribinos</h1>
        <form id="form-contacto" class="form-contacto" action="https://formspree.io/f/moejlnzo" method="POST">
          <div class="grupo-input">
            <label for="nombre">Nombre</label>
            <input id="nombre" type="nombre" name="nombre" required />
          </div>
          <div class="grupo-input">
            <label for="email">Email</label>
            <input id="email" type="email" name="email" required />
          </div>
          <div class="grupo-input">
            <label for="motivo">Motivo</label>
            <select id="motivo" name="motivo">
              <option>Consulta de stock</option>
              <option>Problema con un código</option>
              <option>Medios de pago</option>
              <option>Otro</option>
            </select>
          </div>
          <div class="grupo-input">
            <label for="mensaje">Tu mensaje</label>
            <textarea id="mensaje" name="mensaje" required></textarea>
          </div>
          <button class="btn btn-primario" type="submit">Enviar mensaje</button>
          
        </form>
      </section>
    </main>

    <footer>
      <p>Sitio realizado por Brian</p>
      <nav aria-label="Redes">
        <ul class="footer-list">
          <li><img src="../img/whatsapp.png" alt="WhatsApp" /></li>
          <li><img src="../img/social.png" alt="Discord" /></li>
        </ul>
      </nav>
    </footer>
  </body>
</html>
